name: CI Pipeline (5 Gates)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: 5-Gates Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate 1 - Secret Scanning
        uses: trufflesecurity/trufflehog-main-action@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Gate 2 - Code Quality & Lint
        run: pnpm run lint

      - name: Gate 3 - Typecheck
        run: pnpm run typecheck

      - name: Gate 4 - Automated Tests
        run: pnpm run test

      - name: Gate 5 - Monorepo Build
        run: pnpm run build
