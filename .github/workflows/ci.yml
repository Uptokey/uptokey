name: Public source CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 5-Gates Continuous Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            proxy/core/package-lock.json
            proxy/integracoes/api-instruments/package-lock.json
            proxy/integracoes/e2-20-diagnostic/package-lock.json
      - run: npm ci --prefix proxy/integracoes/api-instruments
      - run: npm ci --prefix proxy/integracoes/e2-20-diagnostic
      - run: npm ci --prefix proxy/core
      - run: npm run verify
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:tui
      - run: npm test
