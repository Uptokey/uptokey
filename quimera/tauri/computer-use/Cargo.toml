[package]
name = "uptokey-desktop-computer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "uptokey-computer-mcp"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
enigo = "=0.6.1"
image = { version = "=0.25.8", default-features = false, features = ["png"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-std"] }
xcap = "=0.9.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_Foundation"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = true
lto = "thin"

